services:
  bot:
    build: .
    image: huubhuub
    restart: unless-stopped
    env_file: .env
    ports:
      # Admin UI. Bind to localhost and put a TLS proxy in front if you expose it.
      - "127.0.0.1:8080:8080"
      # OpenCode web UI, opened from the admin UI. Same advice applies.
      - "127.0.0.1:4196:4196"
    volumes:
      - ./workspace:/workspace
      - bot-data:/data

volumes:
  bot-data:
