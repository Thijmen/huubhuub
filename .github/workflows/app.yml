# The phone app (app/). Pull requests: typecheck and tests. Pushes to main that touch the app: an Android APK
# when native code changed (its fingerprint), otherwise an over-the-air update to the APKs already installed.
#
# Needs the repository secret EXPO_TOKEN (an Expo access token) and the project ID in app/app.config.ts; the
# deploy job is skipped without the token. Before the first run, build once by hand so EAS has the signing key:
#   cd app && bunx eas-cli build --platform android --profile preview
name: App

on:
  pull_request:
    paths: ["app/**", "src/app-api/protocol.ts", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "src/app-api/protocol.ts", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the fingerprint action commits version bumps
    steps:
      - name: Check for the Expo token
        id: token
        env:
          TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Set the EXPO_TOKEN secret to build the app."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.token.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - if: steps.token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}
      - if: steps.token.outputs.present == 'true'
        run: bun install --frozen-lockfile
        working-directory: app
      - if: steps.token.outputs.present == 'true'
        id: deploy
        uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        with:
          working-directory: app
          profile: preview
          branch: preview
          environment: preview
          platform: android
      - if: steps.token.outputs.present == 'true'
        env:
          BUILD: ${{ steps.deploy.outputs.android-build-id }}
          FINGERPRINT: ${{ steps.deploy.outputs.android-fingerprint }}
        run: |
          if [ -n "$BUILD" ]; then
            echo "Started APK build \`$BUILD\`. When it's done, open it under Builds on expo.dev and scan its QR code with the phone to install." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published an update for fingerprint \`$FINGERPRINT\`; installed apps pick it up on their next start." >> "$GITHUB_STEP_SUMMARY"
          fi
