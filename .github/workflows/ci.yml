# Tests on every pull request and push to main. Releases go through Changesets
# (https://changesets.dev): each PR adds a .changeset/*.md entry, and on a push to main:
#   1. while entries are pending, the release job opens or updates a "Version Packages" PR that
#      bumps package.json, writes CHANGELOG.md and removes the entries,
#   2. once that PR is merged, it tags the commit vX.Y.Z and publishes a GitHub release with the
#      changelog entry; then the image job builds ghcr.io/thijmen/huubhuub for amd64 and arm64
#      (the k3s cluster is arm64) and pushes it as X.Y.Z, sha-<short> and latest,
#   3. update_infra opens a PR on the GitOps repo bumping k8s/services/huub/app/values.yaml
#      (image.repository and image.tag), which Argo CD deploys once merged.
# Merges that don't release (pending entries, or none at all) build and deploy nothing.
#
# The release job needs "Allow GitHub Actions to create and approve pull requests" enabled in
# the repo's Actions settings. Step 3 needs the repository variable GITOPS_REPO (owner/name,
# e.g. Thijmen/infra-argocd) and the secret INFRA_ARGOCD_PAT (contents + pull-requests write on
# that repo); it is skipped without either. GITHUB_TOKEN covers the rest.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/thijmen/huubhuub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the Version Packages branch, the vX.Y.Z tag and the release
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ fromJSON(steps.changesets.outputs.published-packages || '[{}]')[0].version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changeset git-tag skips versions that are already tagged
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          publish-script: bun run release
          commit-message: "Release huubhuub"
          pr-title: "Release huubhuub"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.release.outputs.version }}
      has_infra_pat: ${{ steps.pat.outputs.present }}
    steps:
      - name: Check for the GitOps token
        id: pat
        env:
          PAT: ${{ secrets.INFRA_ARGOCD_PAT }}
        run: echo "present=$([ -n "$PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      # arm64 is built under QEMU so bun installs the arm64 opencode binary.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "::notice::${IMAGE}:${VERSION}"
        env:
          VERSION: ${{ needs.release.outputs.version }}

  update_infra:
    needs: image
    if: needs.image.outputs.has_infra_pat == 'true' && vars.GITOPS_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.INFRA_ARGOCD_PAT }}
      - name: Bump image
        env:
          VERSION: ${{ needs.image.outputs.version }}
        # Sets the repository as well as the tag, so renaming IMAGE carries over to the cluster.
        run: |
          VALUES=k8s/services/huub/app/values.yaml
          sed -i '/^image:/,/^[a-z]/ {
            s#^\(  repository: \).*#\1'"${IMAGE}"'#
            s/^\(  tag: \).*/\1'"${VERSION}"'/
          }' "$VALUES"
          grep -q "repository: ${IMAGE}$" "$VALUES" || { echo "::error::image.repository not updated"; exit 1; }
          grep -q "tag: ${VERSION}" "$VALUES" || { echo "::error::image.tag not updated"; exit 1; }
          git diff -- "$VALUES"
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.INFRA_ARGOCD_PAT }}
          commit-message: "chore(huub): update image to ${{ needs.image.outputs.version }}"
          title: "chore(huub): update image to ${{ needs.image.outputs.version }}"
          body: |
            Automated PR to update the huub image.

            **Image:** `${{ env.IMAGE }}:${{ needs.image.outputs.version }}`
            **Commit:** ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            **Source:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: update-huub-${{ needs.image.outputs.version }}
          base: main
